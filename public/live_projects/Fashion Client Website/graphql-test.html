<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GraphQL Client Test - AG Fashion Hub</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  
  <style>
    body {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .test-section {
      margin-bottom: 3rem;
      padding: 1.5rem;
      background: #f5f5f5;
      border-radius: 8px;
    }
    
    .test-result {
      background: white;
      padding: 1rem;
      border-radius: 4px;
      margin-top: 1rem;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .btn {
      padding: 0.75rem 1.5rem;
      background: #A12390;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      margin-right: 0.5rem;
    }
    
    .btn:hover {
      background: #8B1E7A;
    }
    
    .success {
      color: #4CAF50;
      font-weight: 600;
    }
    
    .error {
      color: #F44336;
      font-weight: 600;
    }
    
    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <h1>GraphQL Client Test</h1>
  <p>Test your GraphQL connection to WordPress</p>
  
  <!-- Test: Fetch Collections -->
  <div class="test-section">
    <h2>Test 1: Fetch All Collections</h2>
    <button class="btn" onclick="testGetCollections()">Run Test</button>
    <div id="collections-result" class="test-result"></div>
  </div>
  
  <!-- Test: Fetch Designs -->
  <div class="test-section">
    <h2>Test 2: Fetch All Designs</h2>
    <button class="btn" onclick="testGetDesigns()">Run Test</button>
    <div id="designs-result" class="test-result"></div>
  </div>
  
  <!-- Test: Fetch Blog Posts -->
  <div class="test-section">
    <h2>Test 3: Fetch Blog Posts</h2>
    <button class="btn" onclick="testGetBlogPosts()">Run Test</button>
    <div id="blog-result" class="test-result"></div>
  </div>
  
  <!-- Test: Configuration -->
  <div class="test-section">
    <h2>Test 4: Check Configuration</h2>
    <button class="btn" onclick="testConfig()">Run Test</button>
    <div id="config-result" class="test-result"></div>
  </div>
  
  <!-- JavaScript -->
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/graphql-client.js"></script>
  
  <script>
    // Test 1: Fetch Collections
    async function testGetCollections() {
      const resultDiv = document.getElementById('collections-result');
      resultDiv.innerHTML = '<p>Loading...</p>';
      
      try {
        const collections = await getAllCollections(false); // Don't use cache for testing
        
        if (collections && collections.length > 0) {
          resultDiv.innerHTML = `
            <p class="success">✅ Success! Found ${collections.length} collection(s)</p>
            <pre>${JSON.stringify(collections, null, 2)}</pre>
          `;
        } else {
          resultDiv.innerHTML = `
            <p class="error">⚠️ No collections found. Please add some collections in WordPress.</p>
          `;
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <p class="error">❌ Error: ${error.message}</p>
          <p>Make sure WordPress is accessible and CORS is configured.</p>
        `;
      }
    }
    
    // Test 2: Fetch Designs
    async function testGetDesigns() {
      const resultDiv = document.getElementById('designs-result');
      resultDiv.innerHTML = '<p>Loading...</p>';
      
      try {
        const designs = await getAllDesigns(5);
        
        if (designs && designs.length > 0) {
          resultDiv.innerHTML = `
            <p class="success">✅ Success! Found ${designs.length} design(s)</p>
            <pre>${JSON.stringify(designs, null, 2)}</pre>
          `;
        } else {
          resultDiv.innerHTML = `
            <p class="error">⚠️ No designs found. Please add some designs in WordPress.</p>
          `;
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <p class="error">❌ Error: ${error.message}</p>
        `;
      }
    }
    
    // Test 3: Fetch Blog Posts
    async function testGetBlogPosts() {
      const resultDiv = document.getElementById('blog-result');
      resultDiv.innerHTML = '<p>Loading...</p>';
      
      try {
        const result = await getBlogPosts(3);
        
        if (result.posts && result.posts.length > 0) {
          resultDiv.innerHTML = `
            <p class="success">✅ Success! Found ${result.posts.length} blog post(s)</p>
            <pre>${JSON.stringify(result, null, 2)}</pre>
          `;
        } else {
          resultDiv.innerHTML = `
            <p class="error">⚠️ No blog posts found. Please add some blog posts in WordPress.</p>
          `;
        }
      } catch (error) {
        resultDiv.innerHTML = `
          <p class="error">❌ Error: ${error.message}</p>
        `;
      }
    }
    
    // Test 4: Check Config
    function testConfig() {
      const resultDiv = document.getElementById('config-result');
      
      const tests = [
        { name: 'CONFIG object exists', pass: typeof CONFIG !== 'undefined' },
        { name: 'GraphQL endpoint set', pass: CONFIG.API.GRAPHQL_ENDPOINT !== '' },
        { name: 'WhatsApp number set', pass: CONFIG.CONTACT.WHATSAPP_NUMBER !== '' },
        { name: 'Social links configured', pass: CONFIG.SOCIAL.INSTAGRAM !== '' }
      ];
      
      const allPass = tests.every(t => t.pass);
      
      resultDiv.innerHTML = `
        <h3>${allPass ? '✅ All Tests Passed' : '⚠️ Some Tests Failed'}</h3>
        ${tests.map(t => `
          <p>${t.pass ? '✅' : '❌'} ${t.name}</p>
        `).join('')}
        <h4>Full Configuration:</h4>
        <pre>${JSON.stringify(CONFIG, null, 2)}</pre>
      `;
    }
  </script>
</body>
</html>
