<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        slate: {
                            800: '#1e293b',
                            900: '#0f172a'
                        },
                        primary: '#8b5cf6',
                        secondary: '#06b6d4'

                    fontFamily: {

            }
        }

<body class="bg-dark text-slate-200 antialiased selection:bg-primary selection:text-white">

    <!-- Navigation -->
    <nav
        class="fixed top-0 w-full z-50 px-6 py-6 flex justify-between items-center backdrop-blur-sm bg-dark/50 border-b border-white/5 transition-all duration-300">

            <!-- Projects Grid -->
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
