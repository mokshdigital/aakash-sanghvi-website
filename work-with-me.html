<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work With Me | Aakash Sanghvi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        slate: {
                            800: '#1e293b',
                            900: '#0f172a'
                        },
                        primary: '#8b5cf6',
                        secondary: '#06b6d4'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body class="bg-dark text-slate-200 antialiased selection:bg-primary selection:text-white cursor-none">

    <!-- Custom Cursor -->
    <div id="cursor-dot" class="hidden md:block"></div>
    <div id="cursor-outline" class="hidden md:block"></div>

    <!-- Navigation -->
    <nav
        class="fixed top-0 w-full z-50 px-6 py-6 flex justify-between items-center backdrop-blur-sm bg-dark/50 border-b border-white/5 transition-all duration-300">
        <a href="index.html" class="text-xl font-bold tracking-tighter hover-magnet cursor-pointer z-50 text-white">
            AAKASH SANGHVI.
        </a>
        <div class="hidden md:flex gap-8 text-sm font-medium text-white">
            <a href="index.html" class="hover:text-primary transition-colors hover-magnet">Back Home</a>
            <a href="projects.html" class="hover:text-primary transition-colors hover-magnet">Projects</a>
            <a href="work-with-me.html"
                class="px-5 py-2 bg-white text-black rounded-full font-bold transition-all hover-magnet">Work With
                Me</a>
        </div>
    </nav>

    <main class="pt-32 pb-24 min-h-screen">
        <div class="container mx-auto px-6 max-w-4xl">
            <header class="text-center mb-16">
                <h1 class="text-4xl md:text-6xl font-bold mb-6">Let's Work Together</h1>
                <p class="text-slate-400 text-lg">Book a time to chat about your project or collaboration 🤝</p>
            </header>

            <!-- Contact Form -->
            <div class="bg-slate-800/50 p-8 md:p-12 rounded-2xl border border-white/10 shadow-2xl mb-16 fade-up">
                <h3 class="text-2xl font-bold mb-8">Send Me a Message</h3>
                <form id="contactForm" class="space-y-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-400 mb-2">Your Name</label>
                        <input type="text" id="name" name="name" required
                            class="w-full bg-slate-900/50 border border-white/10 rounded-lg px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-slate-600"
                            placeholder="John Doe">
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-400 mb-2">Your Email</label>
                        <input type="email" id="email" name="email" required
                            class="w-full bg-slate-900/50 border border-white/10 rounded-lg px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-slate-600"
                            placeholder="john@example.com">
                    </div>

                    <div>
                        <label for="message" class="block text-sm font-medium text-slate-400 mb-2">Your Message</label>
                        <textarea id="message" name="message" required rows="5"
                            class="w-full bg-slate-900/50 border border-white/10 rounded-lg px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder-slate-600"
                            placeholder="Tell me about your project..."></textarea>
                    </div>

                    <button type="submit"
                        class="w-full py-4 bg-gradient-to-r from-primary to-secondary text-white font-bold rounded-xl hover:scale-[1.02] active:scale-[0.98] transition-all"
                        id="submitBtn">
                        Send Message
                    </button>

                    <p id="formMessage" class="text-center text-sm font-medium hidden"></p>
                </form>
            </div>

            <div class="relative py-8 text-center">
                <div class="absolute inset-0 flex items-center" aria-hidden="true">
                    <div class="w-full border-t border-white/10"></div>
                </div>
                <div class="relative flex justify-center">
                    <span class="bg-dark px-4 text-sm text-slate-500 font-mono">OR SCHEDULE A CALL</span>
                </div>
            </div>

            <!-- Calendar Booking -->
            <div class="mt-16 bg-white rounded-2xl overflow-hidden shadow-2xl p-4 fade-up">
                <iframe
                    src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ1j1OpwxGCVAuNV4lJDe8qItvOir5jXT6V25QDQfjtpIMwNzJh2Z2h0yEUUKU8WUbMpg6Fq-qpl?gv=true"
                    style="border: 0" width="100%" height="600" frameborder="0" title="Booking Calendar">
                </iframe>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-12 border-t border-white/5 bg-dark relative z-10 text-center">
        <p class="text-slate-600 text-sm">
            &copy; 2024 Aakash Sanghvi. Built with <span class="text-primary">Supabase</span> & <span
                class="text-secondary">GSAP</span>.
        </p>
    </footer>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="script.js"></script>

    <script>
        // Animations
        gsap.from(".fade-up", {
            y: 50, opacity: 0, duration: 0.8, stagger: 0.2, ease: "power3.out"
        });

        // Contact Form Handler
        document.getElementById('contactForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const formMessage = document.getElementById('formMessage');
            const form = e.target;
            const originalBtnText = submitBtn.textContent;

            // Get form data
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            submitBtn.classList.add('opacity-70');
            formMessage.classList.add('hidden');

            try {
                // Ensure Supabase is ready
                if (typeof supabase === 'undefined') {
                    // Fallback if global supabase var isn't ready
                    if (window.supabase && window.supabase.createClient) {
                        // It might be uninitialized in config.js but library loaded?
                        // If config.js ran, 'supabase' global should be set.
                        // We'll assume correct config loading for now.
                    }
                }

                // If using config.js, 'supabase' should be available globally.
                // Insert into Supabase
                const { data, error } = await supabase
                    .from('contacts')
                    .insert([formData]);

                if (error) throw error;

                // Success!
                formMessage.textContent = '✅ Message sent successfully! I\'ll get back to you soon.';
                formMessage.className = 'text-center text-sm font-medium text-green-400 mt-4 block';
                form.reset();

            } catch (error) {
                console.error('Error:', error);
                formMessage.textContent = '❌ Oops! Something went wrong. Please try again.';
                formMessage.className = 'text-center text-sm font-medium text-red-400 mt-4 block';
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
                submitBtn.classList.remove('opacity-70');
            }
        });
    </script>
</body>

</html>
